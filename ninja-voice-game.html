<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ninja Voice Game</title>
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #0f172a; font-family: -apple-system, system-ui, Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
#app { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; }

/* פס עליון */
#hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
       padding: max(10px, env(safe-area-inset-top)) 14px 10px; color: #fff; font-weight: 800;
       font-size: clamp(15px, 2.3vw, 22px); pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
#hud .sp { flex: 1; }
#hud button { pointer-events: auto; }
.hbtn { background: rgba(15,23,42,.55); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px;
        font-size: clamp(13px, 1.9vw, 17px); font-weight: 800; }
#mic { width: 18px; height: 18px; border-radius: 50%; background: #64748b; display: inline-block; vertical-align: middle;
       transition: transform .08s, background .08s; flex: none; }
#mic.on { background: #16a34a; }
#mic.loud { background: #4ade80; transform: scale(1.5); box-shadow: 0 0 14px #4ade80; }
#progress { width: clamp(110px, 26vw, 300px); height: 14px; background: rgba(15,23,42,.45); border-radius: 7px; overflow: hidden; }
#progress div { height: 100%; width: 0; background: #fde047; border-radius: 7px; transition: width .25s; }
#catchHud { background: rgba(15,23,42,.45); border-radius: 10px; padding: 2px 10px; }
#catchHud.pop { animation: pop .35s; }
@keyframes pop { 50% { transform: scale(1.35); } }
.hide { display: none !important; }

/* חלונות מעל המשחק */
.overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           background: rgba(15,23,42,.5); padding: 16px; }
.overlay.show { display: flex; }
.panel { background: #fff; color: #1e293b; border-radius: 22px; padding: clamp(12px, 2.6vh, 26px) clamp(14px, 3vw, 30px);
         text-align: center; width: min(640px, 100%); max-height: 100%; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.panel h1 { font-size: clamp(22px, 4.2vh, 40px); margin-bottom: 2px; }
.panel h2 { font-size: clamp(26px, 5vh, 42px); margin-bottom: 4px; }
.panel p { font-size: clamp(13px, 2vh, 18px); color: #475569; margin-bottom: 4px; line-height: 1.35; }
.label { font-size: clamp(11px, 1.7vh, 14px); font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; margin: clamp(6px, 1.3vh, 12px) 0 5px; }
.status { font-size: clamp(12px, 1.8vh, 16px); color: #64748b; min-height: 1.4em; margin-top: 2px; }
.status.err { color: #dc2626; }

/* בחירת קושי */
.diffs { display: flex; gap: 8px; justify-content: center; }
.diff { flex: 1; max-width: 170px; border: 3px solid transparent; border-radius: 12px; padding: clamp(5px, 1vh, 9px) 6px;
        font-size: clamp(15px, 2.3vh, 19px); font-weight: 900; color: #fff; opacity: .55; }
.diff small { display: block; font-size: clamp(11px, 1.5vh, 13px); font-weight: 600; }
.diff.sel { opacity: 1; border-color: #1e293b; }
.easy { background: #16a34a; } .medium { background: #f59e0b; } .hard { background: #dc2626; }

/* שלבים – שורה לכל זוג מילים */
.stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(6px, 1vh, 9px); }
.stage { border: 0; border-radius: 13px; padding: clamp(5px, 1vh, 9px) 4px; background: #4f46e5; color: #fff;
         display: flex; align-items: center; justify-content: center; gap: 8px; }
.stage .num { font-size: clamp(18px, 3.2vh, 28px); font-weight: 900; line-height: 1; min-width: 1.2em; }
.stage .info { text-align: start; }
.stage .name { font-size: clamp(11px, 1.7vh, 14px); font-weight: 800; }
.stage .stars { font-size: clamp(12px, 2vh, 17px); color: #fde047; letter-spacing: 1px; }
.stage.locked { background: #cbd5e1; color: #64748b; }
.stage:disabled { opacity: .5; }
.menuRow { display: flex; gap: 10px; justify-content: center; margin-top: clamp(7px, 1.4vh, 12px); }
.free { border: 0; border-radius: 14px; padding: clamp(7px, 1.4vh, 12px) 22px;
        font-size: clamp(15px, 2.3vh, 19px); font-weight: 900; background: #e2e8f0; color: #1e293b; }
.free:disabled { opacity: .5; }
.free.words { background: #dcfce7; color: #166534; }

/* מילון מילים – פאנל עליון, הנינג'ה מדגים בחלק התחתון */
#dict { position: absolute; top: 0; left: 0; right: 0; display: none; justify-content: center; padding: max(56px, calc(env(safe-area-inset-top) + 50px)) 12px 0; pointer-events: none; }
#dict.show { display: flex; }
#dict .panel { pointer-events: auto; width: min(760px, 100%); padding: clamp(10px, 2vh, 18px); }
#dict .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#dict h2 { font-size: clamp(20px, 3.4vh, 28px); margin: 0; }
#dict .hint { font-size: clamp(12px, 1.8vh, 15px); color: #64748b; }
.wordGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
@media (max-aspect-ratio: 1/1) { .wordGrid { grid-template-columns: repeat(3, 1fr); } }
.word { border: 0; border-radius: 14px; background: #4f46e5; color: #fff; padding: clamp(8px, 1.6vh, 14px) 4px; font-weight: 900;
        font-size: clamp(15px, 2.4vh, 20px); }
.word .ic { display: block; font-size: clamp(22px, 4vh, 34px); line-height: 1.1; margin-bottom: 2px; }
.word.active { background: #16a34a; transform: scale(1.05); }
.closeBtn { border: 0; border-radius: 10px; background: #e2e8f0; color: #1e293b; font-weight: 900; font-size: clamp(14px, 2vh, 17px); padding: 8px 14px; }

/* מסך סיום */
.big { font-size: clamp(44px, 10vh, 80px); font-weight: 900; color: #4f46e5; line-height: 1.1; }
.big.starsBig { color: #f59e0b; letter-spacing: 6px; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: clamp(10px, 2vh, 16px) 24px; font-size: clamp(17px, 2.8vh, 22px);
       font-weight: 900; background: #4f46e5; color: #fff; }
.btn.sec { background: #e2e8f0; color: #1e293b; }

/* חלונית דיבאג */
#debug { position: absolute; left: 10px; bottom: 10px; max-width: min(440px, calc(100% - 20px)); background: rgba(15,23,42,.88);
         color: #e2e8f0; font: 12px/1.55 ui-monospace, Menlo, monospace; padding: 10px 12px; border-radius: 10px;
         display: none; pointer-events: none; white-space: pre-wrap; }
#debug.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <span id="hudFree"><span>Score: <span id="score">0</span></span>&nbsp;&nbsp;<span>Best: <span id="best">0</span></span></span>
    <span id="hudStage" class="hide"><span id="stageName">Stage 1</span></span>
    <div id="progress" class="hide"><div id="progressBar"></div></div>
    <span id="catchHud" class="hide">🪙 <span id="caught">0</span></span>
    <span id="lives"></span>
    <span class="sp"></span>
    <span id="mic"></span>
    <button class="hbtn hide" id="endBtn">End</button>
    <button class="hbtn" id="dbgBtn">🐞</button>
  </div>

  <!-- מסך פתיחה -->
  <div class="overlay show" id="menu">
    <div class="panel">
      <h1>🥷 Ninja Voice</h1>
      <p>Read the word on each obstacle and say it out loud!</p>
      <div class="status" id="status">Loading…</div>

      <div class="label">Difficulty</div>
      <div class="diffs">
        <button class="diff easy" data-diff="easy">Easy<small>Slow · no fail</small></button>
        <button class="diff medium" data-diff="medium">Medium<small>3 lives</small></button>
        <button class="diff hard" data-diff="hard">Hard<small>Fast · 1 life</small></button>
      </div>

      <div class="label">Stages</div>
      <div class="stages" id="stages"></div>

      <div class="menuRow">
        <button class="free" id="freeBtn" disabled>∞ Free Play</button>
        <button class="free words" id="dictBtn">📖 Words</button>
      </div>
    </div>
  </div>

  <!-- מילון מילים -->
  <div id="dict">
    <div class="panel">
      <div class="top">
        <h2>📖 Words</h2>
        <span class="hint">Tap a word to hear it and see it</span>
        <button class="closeBtn" id="dictClose">✕ Back</button>
      </div>
      <div class="wordGrid" id="wordGrid"></div>
    </div>
  </div>

  <!-- מסך סיום -->
  <div class="overlay" id="over">
    <div class="panel">
      <h2 id="overTitle">Game Over</h2>
      <div class="big" id="overBig">0</div>
      <p id="overSub"></p>
      <div class="row">
        <button class="btn" id="primaryBtn">Play again</button>
        <button class="btn sec" id="menuBtn">Menu</button>
      </div>
    </div>
  </div>

  <div id="debug"></div>
</div>

<script>
/* ============================================================
   הגדרות
   ============================================================ */
const MODEL_URL = 'https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz';

// כל המילים שהמשחק מכיר
const WORDS = ['jump', 'down', 'kick', 'throw', 'catch', 'fly'];
const WORD_ICON = { jump: '⬆️', down: '⬇️', kick: '🦶', throw: '✴️', catch: '🪙', fly: '🪁' };

// רמות קושי – קובעות מהירות, לבבות וקפיצה.
// gapT = הזמן (בשניות) בין מכשול למכשול. מוגדר בזמן ולא במרחק,
// כדי שתמיד יהיה מספיק זמן להגיב – גם כשהמהירות עולה.
// gravity / jumpV = הקפיצה. ברמה הקלה היא "מרחפת" יותר.
const LEVELS = {
  easy:   { speed: 35, accel: 0,   maxSpeed: 35, gapT: [2.6, 3.6], lives: Infinity, penalty: 1, gravity: 100, jumpV: 63, forgive: 1.5 },
  medium: { speed: 50, accel: 0,   maxSpeed: 50, gapT: [1.8, 2.6], lives: 3,        penalty: 0, gravity: 160, jumpV: 80, forgive: 0 },
  hard:   { speed: 60, accel: 1.2, maxSpeed: 95, gapT: [1.5, 2.2], lives: 1,        penalty: 0, gravity: 160, jumpV: 80, forgive: 0 }
};

// שלבים. כל זוג מילים מקבל 3 שלבים: מילה אחת, מילה שנייה, ומעורבב.
// מילים חדשות בעתיד = מוסיפים כאן שלבים.
const STAGES = [
  { name: 'JUMP',         words: ['jump'],           count: 8,  hint: 'Say JUMP to jump over boxes' },
  { name: 'DOWN',         words: ['down'],           count: 8,  hint: 'Say DOWN to duck under beams' },
  { name: 'JUMP + DOWN',  words: ['jump', 'down'],   count: 10, hint: 'Read the word!' },
  { name: 'KICK',         words: ['kick'],           count: 8,  hint: 'Say KICK to break walls' },
  { name: 'THROW',        words: ['throw'],          count: 8,  hint: 'Say THROW to stop enemies' },
  { name: 'KICK + THROW', words: ['kick', 'throw'],  count: 10, hint: 'Read the word!' },
  { name: 'CATCH',        words: ['catch'],          count: 8,  hint: 'Say CATCH to grab coins' },
  { name: 'JUMP + FLY',   words: ['fly'],            count: 8,  hint: 'Say JUMP, then FLY in the air' },
  { name: 'CATCH + FLY',  words: ['catch', 'fly'],   count: 10, hint: 'Read the word!' }
];

// איזה מכשול מתאים לכל מילה
const WORD_OBSTACLE = { jump: 'box', down: 'beam', kick: 'wall', throw: 'enemy', catch: 'coin', fly: 'river' };
const HIT_WORD = { box: 'JUMP!', beam: 'DOWN!', wall: 'KICK!', enemy: 'THROW!', river: 'JUMP + FLY!' };

// "העולם" של המשחק: 160 על 100 יחידות, מוגדל לגודל המסך
const W = 160, H = 100, GROUND = 85;
const PLAYER = { x: 25, w: 8, h: 14, duckW: 10, duckH: 8 };
const DUCK_TIME = 1.0;                 // כמה זמן הנינג'ה נשאר כפוף אחרי כל "down"
const INVULN_TIME = 1.2;               // זמן חסינות אחרי פגיעה
const BOX = { w: 6, h: 9 };            // JUMP – קופצים מעליו
const BEAM = { w: 8, clear: 11, thick: 5 }; // DOWN – מתכופפים מתחתיו
const WALL = { w: 5, h: 30 };          // KICK – גבוה מדי לקפיצה
const KICK = { time: 0.5, range: 14 }; // בעיטה פעילה חצי שנייה, מגיעה 14 יחידות קדימה
const ENEMY = { w: 9, h: 22, extra: 0.3 }; // THROW – אויב גבוה, רץ מהר יותר מהמסך
const SHURIKEN = { speed: 110, cooldown: 0.35 };
const COIN = { y: GROUND - 24, reachBack: 4, reachFwd: 34 }; // CATCH – מטבע זהב באוויר
const FLY = { time: 2.5, sink: 3 };    // FLY – גלישה 2.5 שניות, יורד לאט
const RIVER_FACTOR = 1.5;              // הנהר רחב פי 1.5 ממה שקפיצה רגילה עוברת

/* ============================================================
   מצב המשחק
   ============================================================ */
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');

let state = 'menu';           // menu | play | over
let mode = 'free';            // free | stage
let diffKey = loadDiff(), cfg = LEVELS[diffKey];
let stageIdx = 0, playWords = ['jump', 'down'];
let speed = 0, score = 0, lives = 0, hits = 0, done = 0, spawned = 0, caught = 0, coins = 0;
let obstacles = [], shurikens = [], particles = [];
let distSinceSpawn = 0, nextGap = 0, nextType = null, flag = null;
let py = 0, vy = 0, duckT = 0, invulnT = 0, kickT = 0, flyT = 0, catchT = 0, throwT = 0, throwCd = 0;
let flash = null, heard = null, banner = null;
let bgX = 0, lastT = 0;

/* ============================================================
   דיבאג
   ============================================================ */
const dbgLines = {};
function dbg(key, val) {
  dbgLines[key] = val;
  if ($('debug').classList.contains('show')) renderDebug();
}
function renderDebug() {
  $('debug').textContent = Object.entries(dbgLines).map(([k, v]) => k + ': ' + v).join('\n');
}
$('dbgBtn').onclick = () => { $('debug').classList.toggle('show'); renderDebug(); };

/* ============================================================
   שמירה ב-iPad: קושי, כוכבים, שיא
   ============================================================ */
function store(key, val) { try { localStorage.setItem('ninjaVoice_' + key, JSON.stringify(val)); } catch (e) {} }
function load(key, def) {
  try { const v = localStorage.getItem('ninjaVoice_' + key); return v === null ? def : JSON.parse(v); } catch (e) { return def; }
}
function loadDiff() { const d = load('difficulty', 'easy'); return LEVELS[d] ? d : 'easy'; }
function getStars() { return load('stars', {}); }               // { "0": 3, "1": 2, ... }
function getBest(d) {
  let old = 0;   // תמיכה גם בשיא שנשמר בגרסה הראשונה
  try { old = parseInt(localStorage.getItem('ninjaVoiceBest_' + d)) || 0; } catch (e) {}
  return Math.max(old, load('best_' + d, 0));
}
function isUnlocked(i, stars) { return i === 0 || (stars[i - 1] || 0) > 0; }

// ב-Free Play משתמשים בכל המילים מהשלבים שכבר נפתחו
function freeWords() {
  const stars = getStars(), set = new Set(['jump', 'down']);
  STAGES.forEach((s, i) => { if (isUnlocked(i, stars)) s.words.forEach(w => set.add(w)); });
  return [...set];
}

/* ============================================================
   מסך פתיחה
   ============================================================ */
function renderMenu() {
  document.querySelectorAll('.diff').forEach(b => b.classList.toggle('sel', b.dataset.diff === diffKey));
  const stars = getStars();
  const box = $('stages');
  box.innerHTML = '';
  STAGES.forEach((s, i) => {
    const unlocked = isUnlocked(i, stars);
    const got = stars[i] || 0;
    const b = document.createElement('button');
    b.className = 'stage' + (unlocked ? '' : ' locked');
    b.disabled = !model || !unlocked;
    b.innerHTML = '<div class="num">' + (unlocked ? (i + 1) : '🔒') + '</div>' +
                  '<div class="info"><div class="name">' + s.name + '</div>' +
                  '<div class="stars">' + (unlocked ? '★'.repeat(got) + '☆'.repeat(3 - got) : '&nbsp;') + '</div></div>';
    b.onclick = () => play('stage', i);
    box.appendChild(b);
  });
  $('freeBtn').disabled = !model;
}

document.querySelectorAll('.diff').forEach(b => {
  b.onclick = () => { diffKey = b.dataset.diff; cfg = LEVELS[diffKey]; store('difficulty', diffKey); renderMenu(); };
});
$('freeBtn').onclick = () => play('free');

/* ============================================================
   זיהוי דיבור – Vosk
   ============================================================ */
let model = null, audio = null, noise = 0.01;
let seenWords = [];   // המילים שכבר הפעלנו במשפט הנוכחי

function setStatus(text, isErr) {
  const s = $('status');
  s.textContent = text;
  s.classList.toggle('err', !!isErr);
}

async function loadModel() {
  if (typeof Vosk === 'undefined') {
    setStatus('Voice library did not load. Check the internet and reload.', true);
    dbg('model', 'Vosk library missing');
    return;
  }
  setStatus('Loading voice engine… (first time can take a minute)');
  dbg('model', 'loading…');
  const t0 = performance.now();
  try {
    model = await Vosk.createModel(MODEL_URL);
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    setStatus('Ready! Choose a stage');
    dbg('model', 'ready (' + secs + 's)');
    renderMenu();
  } catch (e) {
    setStatus('Voice engine failed to load: ' + (e.message || e), true);
    dbg('model', 'ERROR ' + (e.message || e));
  }
}

// מפעיל את המיקרופון בפעם הראשונה (חייב לקרות בתוך לחיצה)
async function ensureAudio() {
  if (audio) { audio.ctx.resume(); return true; }
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  dbg('mic', 'requesting…');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    });
    // רשימת מילים סגורה – רק המילים של המשחק. כל השאר "לא מוכר"
    const rec = new model.KaldiRecognizer(ac.sampleRate, JSON.stringify([...WORDS, '[unk]']));
    rec.on('partialresult', m => handleText(m.result.partial, false));
    rec.on('result', m => handleText(m.result.text, true));

    const src = ac.createMediaStreamSource(stream);
    const node = ac.createScriptProcessor(2048, 1, 1);
    node.onaudioprocess = e => { try { rec.acceptWaveform(e.inputBuffer); } catch (err) {} };
    const an = ac.createAnalyser();
    an.fftSize = 1024;
    src.connect(an); src.connect(node); node.connect(ac.destination);

    audio = { ctx: ac, stream, node, rec, an, buf: new Float32Array(1024) };
    $('mic').className = 'on';
    dbg('mic', 'on (' + ac.sampleRate + ' Hz)');
    return true;
  } catch (e) {
    try { ac.close(); } catch (_) {}
    setStatus('Microphone problem: ' + (e.message || e), true);
    dbg('mic', 'ERROR ' + (e.message || e));
    return false;
  }
}

// עוקבים אחרי רצף המילים ששמענו (למשל "down down jump").
// כל מילה חדשה בסוף הרצף מפעילה פקודה מיד.
// אם Vosk "מתקן" את המילה האחרונה (שמע down ואז הבין שזה jump) – מפעילים את המילה המתוקנת.
function handleText(text, isFinal) {
  const words = (text || '').toLowerCase().split(/\s+/).filter(w => WORDS.includes(w));
  for (let i = 0; i < words.length; i++) {
    if (i >= seenWords.length) {
      seenWords.push(words[i]);
      voiceCommand(words[i]);
    } else if (i === words.length - 1 && words[i] !== seenWords[i]) {
      seenWords[i] = words[i];
      voiceCommand(words[i]);
    }
  }
  if (text) dbg('heard', '"' + text + '"' + (isFinal ? ' (final)' : ''));
  if (isFinal) seenWords = [];
}

// בזמן שהמילון מקריא מילה, המיקרופון שומע אותה – לא מפעילים אותה פעמיים
let ignoreVoiceUntil = 0;
function voiceCommand(w) {
  if (performance.now() < ignoreVoiceUntil) { dbg('heard', w + ' (ignored – speaker)'); return; }
  command(w, 'voice');
}

// מד עוצמה – הנורית נדלקת ברגע שמתחילים לדבר
function updateMic() {
  if (!audio) return;
  audio.an.getFloatTimeDomainData(audio.buf);
  let s = 0;
  for (let i = 0; i < audio.buf.length; i++) s += audio.buf[i] * audio.buf[i];
  const rms = Math.sqrt(s / audio.buf.length);
  const loud = rms > Math.max(0.02, noise * 4);
  if (!loud) noise = noise * 0.97 + rms * 0.03;
  $('mic').className = loud ? 'loud' : 'on';
}

/* ============================================================
   פקודות – פועלות מיד, גם אם זו לא המילה הנכונה למכשול
   ============================================================ */
function command(word, source) {
  dbg('command', word + ' (' + source + ')');
  if (state !== 'play' && !(state === 'demo' && source === 'demo')) return;   // במילון – רק ההדגמה מזיזה את הנינג'ה
  heard = { text: word.toUpperCase(), t: 0.8 };

  if (word === 'jump') {
    if (py === 0) { vy = cfg.jumpV; py = 0.001; duckT = 0; }   // קופץ גם מתוך התכופפות
  } else if (word === 'down') {
    duckT = DUCK_TIME;                     // כל "down" נוסף מאריך את ההתכופפות
    flyT = 0;
    if (py > 0) vy = Math.min(vy, -60);    // באוויר – נוחת מהר
  } else if (word === 'kick') {
    kickT = KICK.time;                     // בעיטה – שוברת קיר שקרוב מספיק
    duckT = 0;
  } else if (word === 'throw') {
    if (throwCd <= 0) {                    // זורק שוריקן קדימה
      const pb = playerBox();
      shurikens.push({ x: pb.r, y: pb.t + 5, rot: 0 });
      throwCd = SHURIKEN.cooldown; throwT = 0.25;
    }
  } else if (word === 'catch') {
    catchT = 0.4;                          // תופס מטבע שקרוב מספיק
    const s = obstacles.find(o => o.type === 'coin' && !o.caught && !o.passed &&
                                  o.x + 3 >= PLAYER.x - COIN.reachBack && o.x <= PLAYER.x + COIN.reachFwd);
    if (s) catchCoin(s);
  } else if (word === 'fly') {
    if (py > 0 && flyT <= 0) {             // FLY עובד רק באוויר – אחרי קפיצה
      flyT = FLY.time; duckT = 0;
      burst(PLAYER.x + 4, GROUND - py - 16, '#f8fafc', 6);
    }
  }
}

// מקלדת – לבדיקה במחשב
const KEYS = { Space: 'jump', ArrowUp: 'jump', ArrowDown: 'down', KeyK: 'kick', KeyT: 'throw', KeyC: 'catch', KeyF: 'fly' };
window.addEventListener('keydown', e => {
  if (KEYS[e.code]) { command(KEYS[e.code], 'key'); e.preventDefault(); }
});

/* ============================================================
   מהלך המשחק
   ============================================================ */
async function play(m, idx) {
  if (!model) return;
  const ok = await ensureAudio();   // נקרא ישירות מהלחיצה
  if (ok) startGame(m, idx);
}

function startGame(m, idx) {
  mode = m; stageIdx = idx || 0; cfg = LEVELS[diffKey];
  playWords = mode === 'stage' ? STAGES[stageIdx].words : freeWords();
  speed = cfg.speed; score = 0; lives = cfg.lives; hits = 0; done = 0; spawned = 0; caught = 0; coins = 0;
  obstacles = []; shurikens = []; particles = []; flag = null;
  distSinceSpawn = 0; nextType = pickType(); nextGap = speed * 2.4;   // המכשול הראשון אחרי ~2 שניות
  py = 0; vy = 0; duckT = 0; invulnT = 0; kickT = 0; flyT = 0; catchT = 0; throwT = 0; throwCd = 0;
  flash = null; heard = null; seenWords = [];
  banner = mode === 'stage'
    ? { text: 'Stage ' + (stageIdx + 1) + ': ' + STAGES[stageIdx].name, sub: STAGES[stageIdx].hint, t: 3 }
    : { text: 'Free Play', sub: 'Words: ' + playWords.map(w => w.toUpperCase()).join(' · '), t: 3 };

  $('menu').classList.remove('show');
  $('over').classList.remove('show');
  $('endBtn').classList.remove('hide');
  $('hudFree').classList.toggle('hide', mode !== 'free');
  $('hudStage').classList.toggle('hide', mode !== 'stage');
  $('progress').classList.toggle('hide', mode !== 'stage');
  $('catchHud').classList.toggle('hide', !playWords.includes('catch'));
  if (mode === 'stage') $('stageName').textContent = 'Stage ' + (stageIdx + 1);
  else $('best').textContent = getBest(diffKey);
  renderHud();
  dbg('game', mode + (mode === 'stage' ? ' ' + (stageIdx + 1) : '') + ' / ' + diffKey);
  state = 'play';
}

function renderHud() {
  $('score').textContent = score;
  $('caught').textContent = caught;
  if (mode === 'stage') $('progressBar').style.width = (100 * done / STAGES[stageIdx].count) + '%';
  if (!isFinite(lives)) $('lives').textContent = '';
  else $('lives').textContent = '❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(Math.max(0, cfg.lives - lives));
}

// חלון סיום – משותף לכל המצבים
function showOver(title, big, sub, primaryLabel, primaryAction, starsStyle) {
  state = 'over';
  $('endBtn').classList.add('hide');
  $('overTitle').textContent = title;
  $('overBig').textContent = big;
  $('overBig').classList.toggle('starsBig', !!starsStyle);
  $('overSub').textContent = sub;
  $('primaryBtn').textContent = primaryLabel;
  $('primaryBtn').onclick = primaryAction;
  $('over').classList.add('show');
}

function catchText() { return coins ? '  ·  🪙 ' + caught + ' / ' + coins : ''; }

function endFree(byButton) {
  const prev = getBest(diffKey);
  const isNew = score > prev;
  if (isNew) store('best_' + diffKey, score);
  $('best').textContent = Math.max(prev, score);
  showOver(byButton ? 'Well done!' : 'Game Over', String(score),
           (isNew && score > 0 ? '🏆 New best!' : 'Best: ' + prev) + catchText(),
           'Play again', () => play('free'));
}

function stageComplete() {
  const misses = hits + (coins - caught);   // מטבע שלא נתפס מוריד כוכבים (אבל לא לבבות)
  const got = misses === 0 ? 3 : misses <= 2 ? 2 : 1;
  const stars = getStars();
  if (got > (stars[stageIdx] || 0)) { stars[stageIdx] = got; store('stars', stars); }
  const hasNext = stageIdx + 1 < STAGES.length;
  showOver('Stage ' + (stageIdx + 1) + ' complete!', '★'.repeat(got) + '☆'.repeat(3 - got),
           (hits === 0 ? 'Perfect – no hits!' : hits === 1 ? '1 hit' : hits + ' hits') + catchText(),
           hasNext ? 'Next stage ▶' : 'Play again',
           hasNext ? () => play('stage', stageIdx + 1) : () => play('stage', stageIdx), true);
}

function stageFailed() {
  showOver('Try again!', '💥', 'Stage ' + (stageIdx + 1) + ': ' + STAGES[stageIdx].name, 'Retry', () => play('stage', stageIdx));
}

function rand(a, b) { return a + Math.random() * (b - a); }

// בוחר את המכשול הבא. לא יותר מ-3 מאותו סוג ברצף
function pickType() {
  let w = playWords[Math.floor(Math.random() * playWords.length)];
  const last = obstacles.slice(-3).map(o => o.type);
  if (playWords.length > 1 && last.length === 3 && last.every(t => t === WORD_OBSTACLE[w])) {
    const others = playWords.filter(x => WORD_OBSTACLE[x] !== WORD_OBSTACLE[w]);
    w = others[Math.floor(Math.random() * others.length)];
  }
  return WORD_OBSTACLE[w];
}

function riverWidth() {
  const airtime = 2 * cfg.jumpV / cfg.gravity;   // כמה זמן קפיצה רגילה באוויר
  return speed * airtime * RIVER_FACTOR;         // רחב מדי לקפיצה בלבד
}

function spawn() {
  const type = nextType;
  const o = { type, x: W + 2, passed: false, hit: false };
  if (type === 'river') o.w = riverWidth();
  if (type === 'coin') coins++;
  obstacles.push(o);
  spawned++;
  distSinceSpawn = 0;

  // הרווח עד המכשול הבא – בשניות, ועוד אורך הנהר אם יש
  nextType = pickType();
  nextGap = speed * rand(cfg.gapT[0], cfg.gapT[1]) + (o.w || 0);
  if (type === 'river') nextGap += speed * FLY.time * 0.8;   // זמן לנחות מהגלישה לפני המכשול הבא
  if (nextType === 'enemy') nextGap *= 1.35;   // אויב רץ מהר יותר – נותנים לו יותר מרווח
}

function playerBox() {
  const ducking = duckT > 0;
  const w = ducking ? PLAYER.duckW : PLAYER.w;
  const h = ducking ? PLAYER.duckH : PLAYER.h;
  const bottom = GROUND - py;
  return { l: PLAYER.x, r: PLAYER.x + w, t: bottom - h, b: bottom };
}

function obstacleBox(o) {
  switch (o.type) {
    case 'box':   return { l: o.x, r: o.x + BOX.w, t: GROUND - BOX.h, b: GROUND };
    case 'beam':  return { l: o.x, r: o.x + BEAM.w, t: -1e6, b: GROUND - BEAM.clear };
    case 'wall':  return { l: o.x, r: o.x + WALL.w, t: GROUND - WALL.h, b: GROUND };
    case 'enemy': return { l: o.x, r: o.x + ENEMY.w, t: GROUND - ENEMY.h, b: GROUND };
    case 'river': return { l: o.x, r: o.x + o.w, t: GROUND, b: GROUND + 20 };
    case 'coin':return { l: o.x, r: o.x + 6, t: COIN.y - 3, b: COIN.y + 3 };
  }
}

// האם הנינג'ה נפגע מהמכשול הזה עכשיו
// ברמה הקלה (forgive) מכווצים את אזור הפגיעה – נגיעה בקצה לא נחשבת
function collides(o, pb) {
  if (o.type === 'coin' || o.broken || o.defeated) return false;
  const m = cfg.forgive || 0;
  if (o.type === 'river') {
    const cx = (pb.l + pb.r) / 2;
    return py === 0 && cx > o.x + 2 + m * 2 && cx < o.x + o.w - 2 - m * 2;   // עומד על הקרקע מעל המים
  }
  const b = obstacleBox(o);
  return pb.l < b.r - m && pb.r > b.l + m && pb.t < b.b - m && pb.b > b.t + m;
}

function onHit(o) {
  o.hit = true;
  if (state === 'demo') {   // במילון – רק מראים את המילה הנכונה, בלי עונש
    flash = { text: HIT_WORD[o.type], t: 1.2 }; invulnT = INVULN_TIME; return;
  }
  hits++; done++;
  flash = { text: HIT_WORD[o.type], t: 1.2 };   // מראה את המילה הנכונה
  invulnT = INVULN_TIME;
  if (isFinite(lives)) {
    lives--;
    renderHud();
    if (lives <= 0) { mode === 'stage' ? stageFailed() : endFree(false); return; }
  } else if (cfg.penalty && mode === 'free') {
    score = Math.max(0, score - cfg.penalty);
  }
  renderHud();
}

// הצלחה במכשול (בעיטה, שוריקן, תפיסה, או מעבר)
function cleared(o) {
  if (o.passed) return;
  o.passed = true; done++; score++;
  renderHud();
}

function catchCoin(s) {
  s.caught = true; s.ct = 0; caught++;
  cleared(s);
  burst(s.x + 3, COIN.y, '#fde047', 10);
  const el = $('catchHud'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

/* ---------- חלקיקים (ניצוצות, שברי לבנים) ---------- */
function burst(x, y, color, n, power) {
  power = power || 30;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = power * (0.4 + Math.random() * 0.8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 15, life: 0.6 + Math.random() * 0.4, color, size: 0.8 + Math.random() * 1.2 });
  }
}

function update(dt) {
  if (cfg.accel) speed = Math.min(cfg.maxSpeed, speed + cfg.accel * dt);

  // הנינג'ה
  if (flyT > 0) {
    flyT -= dt;
    vy = -FLY.sink;                 // גולש – יורד לאט
    py += vy * dt;
    if (py <= 0) { py = 0; vy = 0; flyT = 0; }
  } else if (py > 0 || vy > 0) {
    vy -= cfg.gravity * dt;
    py += vy * dt;
    if (py <= 0) { py = 0; vy = 0; }
  }
  if (duckT > 0) duckT -= dt;
  if (invulnT > 0) invulnT -= dt;
  if (kickT > 0) kickT -= dt;
  if (catchT > 0) catchT -= dt;
  if (throwT > 0) throwT -= dt;
  if (throwCd > 0) throwCd -= dt;
  if (flash && (flash.t -= dt) <= 0) flash = null;
  if (heard && (heard.t -= dt) <= 0) heard = null;
  if (banner && (banner.t -= dt) <= 0) banner = null;

  // מכשולים חדשים / דגל סיום
  const dx = speed * dt;
  bgX += dx;
  distSinceSpawn += dx;
  if (state === 'play' && distSinceSpawn >= nextGap) {
    if (mode === 'free' || spawned < STAGES[stageIdx].count) spawn();
    else if (!flag) flag = { x: W + 2 };
  }

  const pb = playerBox();
  if (state === 'demo') demoAuto(pb, dt);

  // שוריקנים
  for (const s of shurikens) {
    s.x += SHURIKEN.speed * dt; s.rot += dt * 18;
    for (const o of obstacles) {
      if (o.type !== 'enemy' || o.defeated) continue;
      const b = obstacleBox(o);
      if (s.x > b.l && s.x < b.r && s.y > b.t && s.y < b.b) {
        o.defeated = true; o.ft = 0; s.dead = true;
        burst(o.x + ENEMY.w / 2, GROUND - ENEMY.h / 2, '#ef4444', 10);
        cleared(o);
        break;
      }
    }
  }
  shurikens = shurikens.filter(s => !s.dead && s.x < W + 10);

  for (const o of obstacles) {
    o.x -= dx;
    if (o.type === 'enemy' && !o.defeated) o.x -= speed * ENEMY.extra * dt;   // אויב רץ לקראתך
    if (o.defeated) o.ft += dt;
    if (o.caught) o.ct += dt;

    // בעיטה שוברת קיר שקרוב מספיק
    if (o.type === 'wall' && !o.broken && kickT > 0 && o.x - pb.r <= KICK.range && o.x + WALL.w > pb.l) {
      o.broken = true;
      for (let i = 0; i < 14; i++) burst(o.x + 2.5, GROUND - Math.random() * WALL.h, '#94a3b8', 1, 45);
      cleared(o);
    }

    if (!o.hit && !o.passed && invulnT <= 0 && collides(o, pb)) { onHit(o); if (state === 'over') return; }
    const ob = obstacleBox(o);
    if (!o.passed && !o.hit && ob.r < pb.l) {
      if (o.type === 'coin') { o.passed = true; done++; renderHud(); }   // מטבע שהוחמץ – בלי נקודה, בלי עונש
      else cleared(o);                                                     // עבר את המכשול בשלום
    }
  }
  obstacles = obstacles.filter(o => {
    const r = o.type === 'river' ? o.x + o.w : o.x + 15;
    return r > -10 && !(o.caught && o.ct > 0.35);
  });

  // חלקיקים
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);

  if (flag) {
    flag.x -= dx;
    if (flag.x <= PLAYER.x + PLAYER.w) { stageComplete(); return; }
  }
  dbg('speed', speed.toFixed(1));
}

/* ============================================================
   ציור
   ============================================================ */
let cw = 0, ch = 0, scale = 1, ox = 0, oy = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cw = window.innerWidth; ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(cw / W, ch / H);
  ox = (cw - W * scale) / 2;
  oy = (ch - H * scale) * 0.75;   // במצב לאורך – יותר שמיים, פחות אדמה
}
window.addEventListener('resize', resize);
resize();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function label(text, cx, cy, size, bg, fg) {
  ctx.font = '900 ' + size + 'px -apple-system, system-ui, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(text).width;
  roundRect(cx - tw / 2 - size * 0.4, cy - size * 0.65, tw + size * 0.8, size * 1.3, size * 0.35);
  ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.fillText(text, cx, cy + size * 0.05);
}

function bigText(text, y, size, color) {
  ctx.font = '900 ' + size + 'px -apple-system, system-ui, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color; ctx.fillText(text, W / 2, y);
}

function star4(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, rr = i % 2 ? r * 0.35 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function draw() {
  // שמיים על כל המסך
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#e0f2fe');
  ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(ox, oy); ctx.scale(scale, scale);
  const left = -ox / scale, right = (cw - ox) / scale, top = -oy / scale, bottom = (ch - oy) / scale;

  // הרים ברקע (זזים לאט)
  ctx.fillStyle = '#93c5fd';
  const mOff = (bgX * 0.15) % 60;
  for (let x = left - 60 - mOff; x < right + 60; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, GROUND); ctx.lineTo(x + 30, GROUND - 28); ctx.lineTo(x + 60, GROUND); ctx.fill();
  }

  // קרקע
  ctx.fillStyle = '#a16207'; ctx.fillRect(left, GROUND, right - left, bottom - GROUND);
  ctx.fillStyle = '#4ade80'; ctx.fillRect(left, GROUND, right - left, 2);
  ctx.fillStyle = '#854d0e';
  const gOff = bgX % 12;
  for (let x = left - gOff; x < right; x += 12) ctx.fillRect(x, GROUND + 5, 4, 1);

  // מכאן – רק בתוך שטח העולם
  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();

  // נהרות קודם (הם חלק מהקרקע)
  for (const o of obstacles) if (o.type === 'river') drawRiver(o, bottom);
  for (const o of obstacles) if (o.type !== 'river') drawObstacle(o, top);

  // דגל סיום
  if (flag) {
    ctx.fillStyle = '#475569'; ctx.fillRect(flag.x, GROUND - 26, 1.2, 26);
    ctx.fillStyle = '#16a34a';
    ctx.beginPath(); ctx.moveTo(flag.x + 1.2, GROUND - 26); ctx.lineTo(flag.x + 12, GROUND - 22); ctx.lineTo(flag.x + 1.2, GROUND - 18); ctx.fill();
  }

  drawNinja();
  for (const s of shurikens) star4(s.x, s.y, 2, s.rot, '#475569');
  for (const p of particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); }
  ctx.globalAlpha = 1;

  // מה הנינג'ה שמע
  if (heard && (state === 'play' || state === 'demo')) {
    const pb = playerBox();
    label(heard.text, PLAYER.x + 4, pb.t - (flyT > 0 ? 14 : 6), 4, '#16a34a', '#fff');
  }
  ctx.restore();

  // המילה הנכונה אחרי פגיעה / כותרת פתיחה
  if (state === 'play' || state === 'demo') {
    if (flash) bigText(flash.text, 40, 14, '#dc2626');
    else if (banner) {
      bigText(banner.text, 32, 9, '#4f46e5');
      if (banner.sub) bigText(banner.sub, 43, 5, '#1e293b');
    }
  }

  ctx.restore();
}

function drawObstacle(o, top) {
  const x = o.x;
  if (o.type === 'box') {
    const y = GROUND - BOX.h;
    ctx.fillStyle = '#b45309'; ctx.fillRect(x, y, BOX.w, BOX.h);
    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 0.6;
    ctx.strokeRect(x + 0.3, y + 0.3, BOX.w - 0.6, BOX.h - 0.6);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + BOX.w, GROUND); ctx.moveTo(x + BOX.w, y); ctx.lineTo(x, GROUND); ctx.stroke();
    label('JUMP', x + BOX.w / 2, y - 5, 4, '#fde047', '#1e293b');
  } else if (o.type === 'beam') {
    const by = GROUND - BEAM.clear - BEAM.thick;
    ctx.strokeStyle = '#78716c'; ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(x + 1.5, top); ctx.lineTo(x + 1.5, by);
    ctx.moveTo(x + BEAM.w - 1.5, top); ctx.lineTo(x + BEAM.w - 1.5, by);
    ctx.stroke();
    ctx.fillStyle = '#92400e'; roundRect(x - 4, by, BEAM.w + 8, BEAM.thick, 1.2); ctx.fill();
    label('DOWN', x + BEAM.w / 2, by + BEAM.thick / 2, 3.4, '#fde047', '#1e293b');
  } else if (o.type === 'wall') {
    if (o.broken) return;
    const y = GROUND - WALL.h;
    ctx.fillStyle = '#64748b'; ctx.fillRect(x, y, WALL.w, WALL.h);
    ctx.fillStyle = '#94a3b8';
    for (let r = 0; r < 10; r++) {           // לבנים
      const yy = y + r * 3 + 0.4, off = r % 2 ? 0 : 1.25;
      ctx.fillRect(x + 0.3, yy, 2.1 - (off ? 0 : 0), 2.2);
      ctx.fillRect(x + 2.7, yy, 2.0, 2.2);
    }
    label('KICK', x + WALL.w / 2, y - 5, 4, '#fde047', '#1e293b');
  } else if (o.type === 'enemy') {
    drawEnemy(o);
  } else if (o.type === 'coin') {
    const now = performance.now() / 1000;
    let cx = x + 3, cy = COIN.y + Math.sin(now * 4 + x) * 1.6;   // מקפץ למעלה ולמטה
    if (o.caught) {                           // עף אל הנינג'ה
      const k = Math.min(1, o.ct / 0.35), pb = playerBox();
      cx = cx + (PLAYER.x + 4 - cx) * k; cy = cy + (pb.t - cy) * k;
      ctx.globalAlpha = 1 - k * 0.7;
    }
    // הילה זוהרת
    const glow = ctx.createRadialGradient(cx, cy, 1, cx, cy, 7);
    glow.addColorStop(0, 'rgba(253,224,71,.65)'); glow.addColorStop(1, 'rgba(253,224,71,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fill();
    // מטבע מסתובב (רוחב משתנה)
    const sx = Math.max(0.15, Math.abs(Math.cos(now * 3 + x)));
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sx, 1);
    ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(0, 0, 2.9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 0.4; ctx.beginPath(); ctx.arc(0, 0, 2.1, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fef9c3'; ctx.fillRect(-1.6, -1.8, 0.9, 1.6);      // ברק
    ctx.restore();
    // ניצוצות סביב
    for (let i = 0; i < 3; i++) {
      const a = now * 2 + i * 2.1, tw = (Math.sin(now * 6 + i * 3) + 1) / 2;
      if (tw > 0.4) star4(cx + Math.cos(a) * 5.5, cy + Math.sin(a) * 4.5, 0.9 * tw + 0.3, 0, '#fff7ae');
    }
    ctx.globalAlpha = 1;
    if (!o.caught && !o.passed) label('CATCH', cx, cy - 8, 3.6, '#16a34a', '#fff');   // תווית ירוקה = פרס
  }
}

function drawRiver(o, bottom) {
  const x = o.x, w = o.w;
  ctx.fillStyle = '#0284c7'; ctx.fillRect(x, GROUND, w, bottom - GROUND);
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(x, GROUND + 1.5, w, 2.5);
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.6;
  const t = performance.now() / 300;
  for (let i = 0; i < w; i += 9) {          // גלים
    ctx.beginPath(); ctx.moveTo(x + i + 1, GROUND + 7 + Math.sin(t + i) * 0.8); ctx.lineTo(x + i + 5, GROUND + 7 + Math.sin(t + i + 1) * 0.8); ctx.stroke();
  }
  label('JUMP + FLY', x + w / 2, GROUND - 6, 4, '#fde047', '#1e293b');
}

function drawEnemy(o) {
  const x = o.x, h = ENEMY.h, w = ENEMY.w;
  ctx.save();
  if (o.defeated) {                          // נופל ונעלם
    ctx.globalAlpha = Math.max(0, 1 - o.ft * 1.5);
    ctx.translate(x + w / 2, GROUND); ctx.rotate(Math.min(1.5, o.ft * 4)); ctx.translate(-(x + w / 2), -GROUND);
  }
  const t = GROUND - h, headR = 4.4, hx = x + w / 2 - 0.5, hy = t + headR;
  const step = o.defeated ? 0 : Math.sin(performance.now() / 70) * 1.5;
  ctx.fillStyle = '#7f1d1d';
  ctx.fillRect(x + 1.5 + step, GROUND - 6, 2.2, 6); ctx.fillRect(x + w - 3.7 - step, GROUND - 6, 2.2, 6);   // רגליים
  roundRect(x, t + headR * 1.4, w, h - headR * 1.4 - 4, 2); ctx.fill();                                     // גוף
  ctx.beginPath(); ctx.arc(hx, hy, headR, 0, Math.PI * 2); ctx.fill();                                      // ראש
  ctx.fillStyle = '#fcd9b6'; ctx.fillRect(hx - headR + 0.6, hy - 1, headR * 2 - 1.2, 2);
  ctx.fillStyle = '#000'; ctx.fillRect(hx - 2.6, hy - 0.5, 1, 1); ctx.fillRect(hx - 0.6, hy - 0.5, 1, 1);  // מביט שמאלה
  ctx.fillStyle = '#facc15'; ctx.fillRect(x, GROUND - 10, w, 1.2);                                          // חגורה
  ctx.restore();
  if (!o.defeated) label('THROW', x + w / 2, t - 5, 4, '#fde047', '#1e293b');
}

function drawNinja() {
  if (invulnT > 0 && Math.floor(invulnT * 10) % 2 === 0) return;  // הבהוב אחרי פגיעה
  const pb = playerBox();
  const x = pb.l, w = pb.r - pb.l, t = pb.t, b = pb.b;
  const headR = 3.3, hx = x + w / 2 + (duckT > 0 ? 1.5 : 0) - (kickT > 0 ? 1.2 : 0), hy = t + headR;   // בבעיטה – נוטה אחורה

  // גלשן מעל הראש בזמן FLY
  if (flyT > 0) {
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - 8, t - 8); ctx.moveTo(hx, hy); ctx.lineTo(hx + 8, t - 8); ctx.stroke();
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.moveTo(hx - 11, t - 7); ctx.lineTo(hx, t - 13); ctx.lineTo(hx + 11, t - 7); ctx.lineTo(hx, t - 9); ctx.closePath(); ctx.fill();
  }

  // סרט אדום מתנופף
  ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1;
  const wave = Math.sin(performance.now() / 90) * 1.2;
  ctx.beginPath(); ctx.moveTo(hx - headR, hy - 1); ctx.lineTo(hx - headR - 4, hy - 2 + wave); ctx.stroke();

  // בעיטה – רגל עולה באלכסון קדימה, עם קו תנועה
  if (kickT > 0) {
    const k = 1 - kickT / KICK.time;                 // 0→1 לאורך הבעיטה
    const ang = -0.25 - Math.sin(Math.min(1, k * 2.2) * Math.PI / 2) * 0.75;   // רגל מתרוממת
    ctx.save();
    ctx.translate(x + w - 1.5, b - 4.5);              // מפרק הירך
    ctx.rotate(ang);
    ctx.fillStyle = '#1e293b'; roundRect(0, -1.3, 9, 2.6, 1.2); ctx.fill();
    ctx.fillStyle = '#dc2626'; roundRect(7.4, -1.4, 2.2, 2.8, 0.8); ctx.fill();   // כף רגל
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.arc(x + w - 1.5, b - 4.5, 11, -1.3, -0.15); ctx.stroke();
  }

  // גוף
  ctx.fillStyle = '#1e293b';
  roundRect(x, t + headR * 1.3, w, b - t - headR * 1.3, 1.5); ctx.fill();
  // חגורה
  ctx.fillStyle = '#dc2626'; ctx.fillRect(x, b - (b - t) * 0.42, w, 1);
  // יד – מורמת בזמן תפיסה, קדימה בזמן זריקה
  if (catchT > 0) { ctx.fillStyle = '#1e293b'; roundRect(x + w - 2, t - 2, 2, 7, 1); ctx.fill(); }
  if (throwT > 0) { ctx.fillStyle = '#1e293b'; roundRect(x + w - 1, t + 5, 5, 2, 1); ctx.fill(); }
  // ראש
  ctx.fillStyle = '#1e293b';
  ctx.beginPath(); ctx.arc(hx, hy, headR, 0, Math.PI * 2); ctx.fill();
  // פס פנים ועיניים
  ctx.fillStyle = '#fcd9b6'; ctx.fillRect(hx - headR + 0.6, hy - 0.9, headR * 2 - 1.2, 1.8);
  ctx.fillStyle = '#000';
  ctx.fillRect(hx + 0.2, hy - 0.4, 0.8, 0.8);
  ctx.fillRect(hx + 1.8, hy - 0.4, 0.8, 0.8);
}

/* ============================================================
   מילון מילים – לוחצים על מילה, שומעים אותה ורואים מה היא עושה
   ============================================================ */
// במילון אין משחק: הנינג'ה עומד במקום, העולם לא זז, ואין זיהוי קולי.
// לוחצים על מילה → שומעים אותה → הנינג'ה מבצע את הפעולה מול חפץ קטן לידו.
let demoSteps = [], demoClock = 0;

function renderDict() {
  const grid = $('wordGrid');
  grid.innerHTML = '';
  WORDS.forEach(w => {
    const b = document.createElement('button');
    b.className = 'word'; b.dataset.w = w;
    b.innerHTML = '<span class="ic">' + WORD_ICON[w] + '</span>' + w.toUpperCase();
    b.onclick = () => showWord(w);
    grid.appendChild(b);
  });
}

function resetDemo() {
  obstacles = []; shurikens = []; particles = []; flag = null; banner = null; flash = null; heard = null;
  py = 0; vy = 0; duckT = 0; invulnT = 0; kickT = 0; flyT = 0; catchT = 0; throwT = 0; throwCd = 0;
  demoSteps = []; demoClock = 0;
}

function openDict() {
  state = 'demo'; mode = 'demo';
  cfg = LEVELS.medium; speed = 0; lives = Infinity;   // speed 0 = העולם עומד
  resetDemo();
  $('menu').classList.remove('show');
  ['hudFree', 'hudStage', 'progress', 'catchHud', 'endBtn'].forEach(id => $(id).classList.add('hide'));
  $('lives').textContent = '';
  renderDict();
  $('dict').classList.add('show');
}

function speak(w) {
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w);
    u.lang = 'en-US'; u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /^en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    ignoreVoiceUntil = performance.now() + 1600;
    u.onend = () => { ignoreVoiceUntil = performance.now() + 400; };
    speechSynthesis.speak(u);
  } catch (e) {}
}

// חפץ קטן ליד הנינג'ה (אם צריך), ורשימת פעולות לפי זמן
function showWord(w) {
  speak(w);
  document.querySelectorAll('.word').forEach(b => b.classList.toggle('active', b.dataset.w === w));
  resetDemo();
  const near = PLAYER.x + PLAYER.w;
  if (w === 'kick')  obstacles.push({ type: 'wall',  x: near + 6 });
  if (w === 'throw') obstacles.push({ type: 'enemy', x: near + 55 });
  if (w === 'catch') obstacles.push({ type: 'coin',  x: near + 12 });
  obstacles.forEach(o => { o.passed = false; o.hit = false; });
  demoSteps = w === 'fly' ? [{ at: 0.35, w: 'jump' }, { at: 0.75, w: 'fly' }] : [{ at: 0.45, w }];
}

function demoAuto(pb, dt) {
  demoClock += dt;
  while (demoSteps.length && demoClock >= demoSteps[0].at) command(demoSteps.shift().w, 'demo');
}

$('dictBtn').onclick = openDict;
$('dictClose').onclick = toMenu;

/* ============================================================
   לולאה ראשית
   ============================================================ */
function loop(t) {
  const now = t / 1000;
  const dt = Math.min(0.05, lastT ? now - lastT : 0);
  lastT = now;
  if (state === 'play' || state === 'demo') update(dt);
  updateMic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   כפתורים
   ============================================================ */
function toMenu() {
  state = 'menu';
  $('dict').classList.remove('show');
  try { speechSynthesis.cancel(); } catch (e) {}
  $('over').classList.remove('show');
  $('endBtn').classList.add('hide');
  $('hudFree').classList.remove('hide');
  $('hudStage').classList.add('hide');
  $('progress').classList.add('hide');
  $('catchHud').classList.add('hide');
  $('lives').textContent = '';
  obstacles = []; shurikens = []; particles = []; flag = null;
  py = 0; vy = 0; duckT = 0; invulnT = 0; kickT = 0; flyT = 0; catchT = 0; throwT = 0;
  renderMenu();
  if (model) setStatus('Ready! Choose a stage');
  $('menu').classList.add('show');
}
$('menuBtn').onclick = toMenu;
$('endBtn').onclick = () => {
  if (state !== 'play') return;
  if (mode === 'free') endFree(true); else toMenu();
};

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audio) audio.ctx.resume();
});

dbg('model', '—'); dbg('mic', 'off'); dbg('heard', '—'); dbg('command', '—');
renderMenu();
loadModel();
</script>
