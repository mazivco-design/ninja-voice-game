<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <style>
      .outline { stroke: #111116; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .outline-thin { stroke: #111116; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .suit-dark { fill: #24252e; }
      .suit-shadow { fill: #191a21; }
      .red-accent { fill: #e62e2d; }
      .skin { fill: #f5c69c; }
      .gold { fill: #f4b41a; }
      .blade { fill: #d9dce6; }
    </style>
  </defs>

  <!-- שכבה 1: גפיים אחוריות (יד שמאל ורגל שמאל - מוסתרות חלקית מאחורי הגוף) -->
  <g id="back_limbs">
    <!-- זרוע אחורית (ציר כתף: 205, 225) -->
    <g id="arm_back" transform-origin="205 225">
      <path d="M 195 220 L 218 220 L 222 258 L 198 258 Z" class="suit-shadow outline"/>
      <!-- אמה אחורית (ציר מרפק: 210, 258) -->
      <g id="forearm_back" transform-origin="210 258">
        <path d="M 198 255 L 222 255 L 225 288 L 201 288 Z" class="suit-shadow outline"/>
        <rect x="199" y="272" width="25" height="12" rx="2" class="red-accent outline"/>
        <!-- יד אחורית -->
        <circle cx="214" cy="298" r="14" class="skin outline"/>
      </g>
    </g>

    <!-- רגל אחורית (ציר ירך: 205, 305) -->
    <g id="leg_back" transform-origin="205 305">
      <path d="M 188 300 L 222 300 L 220 345 L 186 345 Z" class="suit-shadow outline"/>
      <!-- שוק אחורית (ציר ברך: 203, 345) -->
      <g id="shin_back" transform-origin="203 345">
        <path d="M 188 342 L 218 342 L 216 378 L 190 378 Z" class="suit-shadow outline"/>
        <rect x="189" y="368" width="28" height="13" rx="2" class="red-accent outline"/>
        <!-- נעל אחורית -->
        <path d="M 188 380 L 226 380 C 238 380, 245 388, 245 398 L 188 398 Z" class="suit-shadow outline"/>
        <path d="M 188 398 L 245 398" stroke="#a0a4b2" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- שכבה 2: חרב על הגב + זנבות סרט מצח -->
  <g id="back_gear">
    <!-- חרב על הגב (ציר: 175, 230) -->
    <g id="sword_back" transform-origin="175 230">
      <g transform="rotate(-32 175 230)">
        <!-- נדן -->
        <rect x="160" y="210" width="15" height="145" rx="5" class="suit-dark outline"/>
        <!-- ידית -->
        <rect x="162" y="155" width="11" height="45" rx="2" class="suit-dark outline"/>
        <polygon points="167.5,165 171,169 167.5,173 164,169" class="red-accent"/>
        <polygon points="167.5,176 171,180 167.5,184 164,180" class="red-accent"/>
        <polygon points="167.5,187 171,191 167.5,195 164,191" class="red-accent"/>
        <!-- קצה ידית ומגן יד -->
        <rect x="160" y="149" width="15" height="7" rx="2" class="gold outline-thin"/>
        <rect x="154" y="199" width="27" height="8" rx="3" class="gold outline"/>
      </g>
    </g>

    <!-- זנבות סרט המצח מאחור (ציר עורף: 142, 108) -->
    <g id="headband_tails" transform-origin="142 108">
      <path d="M 145 104 Q 100 88 72 102 Q 95 118 142 112 Z" class="red-accent outline"/>
      <path d="M 144 110 Q 108 118 85 138 Q 112 138 145 116 Z" class="red-accent outline"/>
      <!-- קשר סרט -->
      <circle cx="143" cy="108" r="9" class="red-accent outline"/>
    </g>
  </g>

  <!-- שכבה 3: גוף מרכזי (Torso) - ציר מותן: 200, 305 -->
  <g id="torso" transform-origin="200 305">
    <!-- חולצה -->
    <path d="M 168 212 L 232 212 L 238 308 L 162 308 Z" class="suit-dark outline"/>
    <!-- קו צווארון אלכסוני -->
    <path d="M 218 212 L 195 268" class="outline"/>
    
    <!-- חגורה אדומה -->
    <rect x="160" y="286" width="80" height="17" rx="4" class="red-accent outline"/>
    <!-- קשר החגורה מקדימה -->
    <g id="belt_front" transform-origin="234 294">
      <path d="M 232 300 L 245 335 L 233 335 L 226 302 Z" class="red-accent outline"/>
      <rect x="226" y="284" width="15" height="20" rx="5" class="red-accent outline"/>
    </g>
  </g>

  <!-- שכבה 4: רגל קדמית (ציר ירך: 195, 305) -->
  <g id="leg_front" transform-origin="195 305">
    <!-- ירך -->
    <path d="M 176 300 L 214 300 L 212 348 L 174 348 Z" class="suit-dark outline"/>
    <!-- שוק + כף רגל (ציר ברך: 193, 348) -->
    <g id="shin_front" transform-origin="193 348">
      <path d="M 176 344 L 210 344 L 208 382 L 178 382 Z" class="suit-dark outline"/>
      <!-- חותלת אדומה -->
      <rect x="177" y="372" width="32" height="13" rx="2" class="red-accent outline"/>
      <!-- נעל -->
      <path d="M 176 384 L 218 384 C 232 384, 240 392, 240 404 L 176 404 Z" class="suit-dark outline"/>
      <path d="M 176 404 L 240 404" stroke="#d9dce6" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- שכבה 5: ראש במבט צד (Head) - ציר צוואר: 200, 212 -->
  <g id="head" transform-origin="200 212">
    <!-- ברדס -->
    <path d="M 140 130 C 140 75, 175 58, 215 62 C 252 66, 272 95, 272 135 C 272 182, 245 212, 202 212 C 162 212, 140 182, 140 130 Z" class="suit-dark outline"/>
    
    <!-- פתח הפנים (פרופיל ימני) -->
    <path d="M 212 108 L 266 108 C 270 125, 270 145, 265 158 L 212 158 C 204 145, 204 120, 212 108 Z" class="skin outline"/>

    <!-- עין וגבה -->
    <g id="face_side">
      <ellipse cx="248" cy="133" rx="11" ry="16" fill="#ffffff" class="outline-thin"/>
      <ellipse cx="252" cy="134" rx="7" ry="10" fill="#1a1512"/>
      <circle cx="250" cy="129" r="3" fill="#ffffff"/>
      <!-- גבה כועסת/ממוקדת -->
      <path d="M 226 112 L 265 121 L 263 112 L 228 104 Z" fill="#1a1512" class="outline-thin"/>
    </g>

    <!-- כיסוי פה (Mask) -->
    <path d="M 206 154 Q 242 148 269 156 C 266 192, 240 212, 202 212 C 185 212, 195 175, 206 154 Z" class="suit-dark outline"/>

    <!-- סרט מצח אדום -->
    <path d="M 139 102 Q 205 92 269 100 L 271 120 Q 205 112 141 120 Z" class="red-accent outline"/>
  </g>

  <!-- שכבה 6: זרוע קדמית + חרב שלופה (Arm Front) - ציר כתף: 192, 225 -->
  <g id="arm_front" transform-origin="192 225">
    <!-- זרוע עליונה -->
    <path d="M 178 218 L 206 218 L 204 262 L 176 262 Z" class="suit-dark outline"/>
    <!-- אמה + כף יד (ציר מרפק: 190, 262) -->
    <g id="forearm_front" transform-origin="190 262">
      <path d="M 177 258 L 203 258 L 201 294 L 175 294 Z" class="suit-dark outline"/>
      <!-- מגן אמה אדום -->
      <rect x="176" y="276" width="26" height="13" rx="2" class="red-accent outline"/>
      
      <!-- כף יד / אגרוף (ציר שורש כף יד: 188, 298) -->
      <g id="hand_front" transform-origin="188 298">
        <!-- חרב שלופה (מוסתרת כברירת מחדל - שנה ל-display="inline" בזמן תקיפה) -->
        <g id="active_sword" display="none" transform-origin="192 304">
          <!-- להב -->
          <path d="M 208 298 L 325 275 C 338 273, 345 278, 348 284 L 208 310 Z" class="blade outline"/>
          <!-- מגן יד -->
          <rect x="202" y="290" width="8" height="28" rx="3" class="gold outline"/>
          <!-- ידית -->
          <rect x="172" y="299" width="30" height="10" rx="2" class="suit-dark outline"/>
        </g>

        <!-- אגרוף -->
        <circle cx="189" cy="305" r="15" class="skin outline"/>
        <path d="M 186 305 C 186 299, 196 299, 196 305" fill="none" class="outline-thin"/>
      </g>
    </g>
  </g>
</svg>
