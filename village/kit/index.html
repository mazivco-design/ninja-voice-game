<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>דוגמה 3 – תלת־ממד עם מודלים (KayKit)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; }
  .pill { position: fixed; padding: 6px 14px; border-radius: 999px; background: rgba(15, 23, 42, .6); color: #f8fafc;
          font: 15px system-ui, sans-serif; white-space: nowrap; }
  #hint { top: 12px; left: 50%; transform: translateX(-50%); pointer-events: none; transition: opacity .8s; }
  #back { top: 10px; right: 12px; border-radius: 10px; text-decoration: none; font-size: 14px; }
  #word { position: fixed; left: 0; top: 0; padding: 6px 14px; border-radius: 10px; background: rgba(30, 41, 59, .85); color: #fff;
          font: bold 22px system-ui, sans-serif; letter-spacing: 1px; transform: translate(-50%, -100%); cursor: pointer; display: none; }
  #word.ok { background: rgba(22, 163, 74, .9); }
  #msg { bottom: 18px; left: 50%; transform: translateX(-50%); pointer-events: none; opacity: 0; transition: opacity .4s; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
         font: 17px system-ui, sans-serif; color: #1f2937; text-align: center; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hint" class="pill">דוגמה 3 · נגיעה – הליכה · גרירה – סיבוב המצלמה</div>
<a id="back" class="pill" href="../2d/top/">לדוגמאות הדו־ממדיות</a>
<div id="word">PUSH</div>
<div id="msg" class="pill"></div>
<div id="err">לא הצלחתי לטעון את התלת־ממד. כדאי לבדוק את החיבור לאינטרנט ולרענן.</div>
<script>setTimeout(() => { if (!window.__kit) document.getElementById('err').style.display = 'flex'; }, 15000);</script>
<script type="module" src="main.js"></script>
</body>
</html>
