<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>הכפר – מבט מלמעלה</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2f4a2a; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px;
          background: rgba(15, 23, 42, .55); color: #f8fafc; font: 15px system-ui, sans-serif; pointer-events: none;
          transition: opacity .8s; }
  #back { position: fixed; top: 10px; right: 12px; padding: 6px 12px; border-radius: 10px; background: rgba(15, 23, 42, .55);
          color: #f8fafc; font: 14px system-ui, sans-serif; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">געו במקום כדי ללכת אליו (או חצים במקלדת)</div>
<a id="back" href="../">חזרה למשחק</a>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/room.js"></script>
<script src="js/main.js"></script>

</html>
