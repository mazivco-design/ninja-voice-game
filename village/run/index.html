<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ריצת הנינג'ה – אב־טיפוס</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .pill { position: fixed; padding: 6px 14px; border-radius: 999px; background: rgba(15, 23, 42, .6); color: #f8fafc; font-size: 15px; white-space: nowrap; }
  #hint { top: 12px; left: 50%; transform: translateX(-50%); pointer-events: none; transition: opacity .8s; }
  /* המילה מעל המכשול */
  #tag { position: fixed; left: 0; top: 0; padding: 5px 14px; border-radius: 10px; background: rgba(30, 41, 59, .85); color: #fff;
         font: bold 24px system-ui, sans-serif; letter-spacing: 1px; transform: translate(-50%, -100%); pointer-events: none; display: none; direction: ltr; }
  /* הכפתור הגדול למטה – בינתיים נגיעה במקום קול */
  #say { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) scale(.9); min-width: 190px; padding: 14px 30px; border: 0; border-radius: 18px;
         background: #1e293b; color: #fff; font: bold 34px system-ui, sans-serif; letter-spacing: 2px; box-shadow: 0 6px 0 #0f172a, 0 10px 24px rgba(0,0,0,.25);
         opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s, background .2s; direction: ltr; }
  #say.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
  #say.ok, #tag.ok { background: #16a34a; }
  #say.ok { box-shadow: 0 6px 0 #166534, 0 10px 24px rgba(0,0,0,.25); }
  #end { position: fixed; inset: 0; display: none; flex-direction: column; gap: 18px; align-items: center; justify-content: center; background: rgba(15, 23, 42, .35); }
  #end div { color: #fff; font: bold 40px system-ui, sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #end button { padding: 12px 28px; border: 0; border-radius: 14px; background: #f8fafc; color: #0f172a; font: bold 20px system-ui, sans-serif; }
  #styles { position: fixed; top: 10px; left: 12px; display: flex; gap: 6px; direction: rtl; }
  #styles a { padding: 7px 12px; border-radius: 10px; background: rgba(15, 23, 42, .5); color: #f8fafc; font-size: 14px; text-decoration: none; }
  #styles a.on { background: #f8fafc; color: #0f172a; font-weight: 600; }
  #hint { top: 54px !important; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #bfe3f5; color: #1f2937; font-size: 18px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="load">טוען את העמק…</div>
<div id="hint" class="pill">הנינג'ה רץ לבד · כשמופיעה מילה – נוגעים בה (בהמשך: אומרים אותה)</div>
<div id="styles"><a>רגיל</a><a data-s="paper">קו דק</a><a data-s="wash">כמעט בלי קו</a><a data-s="ink">דיו</a><a data-s="water">צבעי מים</a><a data-s="toon">מצויר</a></div>
<div id="tag"></div>
<button id="say"></button>
<div id="end"><div>הגעת לשער! 🎉</div><button id="again">שוב</button></div>
<script>setTimeout(() => { if (!window.__run) document.getElementById('load').textContent = 'לא הצלחתי לטעון. כדאי לבדוק את החיבור לאינטרנט ולרענן.'; }, 20000);</script>
<script type="module" src="main.js"></script>
</body>
</html>
