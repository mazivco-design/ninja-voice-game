# מייצר קולות ואפקטים ב-ElevenLabs לפי audio/eleven/list.json ושומר אותם במאגר.
# המפתח שמור כסוד ELEVENLABS_API_KEY. קבצים שכבר קיימים לא נוצרים שוב (לא מבזבז קרדיטים).
name: eleven-audio
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: eleven-audio
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/eleven.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: save files
        run: |
          git config user.name "eleven-bot"
          git config user.email "eleven-bot@users.noreply.github.com"
          git add audio/eleven
          git diff --cached --quiet && exit 0
          git commit -m "ElevenLabs audio: generated files"
          git pull --rebase
          git push
