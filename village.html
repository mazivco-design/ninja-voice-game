<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ninja Village – prototype</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; font-family: -apple-system, system-ui, Arial, sans-serif; touch-action: manipulation; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; padding: 10px; pointer-events: none; }
  #ui button { pointer-events: auto; font: 700 16px system-ui; padding: 10px 16px; border: 0; border-radius: 12px; background: rgba(255,255,255,.92); color: #1e293b; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
  #ui button:active { transform: scale(.96); }
  #hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,.6); color: #fff; padding: 6px 14px; border-radius: 10px; font-size: 14px; pointer-events: none; white-space: nowrap; }
  #back { position: absolute; top: 10px; left: 10px; font: 700 14px system-ui; padding: 8px 12px; border: 0; border-radius: 10px; background: rgba(15,23,42,.55); color: #fff; }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <a id="back" href="ninja-voice-game.html">◀ Game</a>
  <div id="hint">Tap where to walk · tap up/down to change lane · tap a door, a ladder or a person</div>
  <div id="ui"></div>
</div>
<script src="ninja-figure.js?v=20261021a"></script>
<script src="js/village.js?v=20261021a"></script>
</body>
</html>
