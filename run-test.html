<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחזור ריצה – תנוחות מפתח</title>
<style>
:root { --bg: #14211a; --panel: #1d2e24; --ink: #e8f0ea; --muted: #a6b8ad; --accent: #e3a33b; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Arial Hebrew', sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 20px; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row p { margin: 0; color: var(--muted); font-size: 14px; }
button { font: 700 15px system-ui; padding: 9px 13px; border: 0; border-radius: 10px; background: var(--panel); color: var(--ink); }
button.on { background: var(--accent); color: #1b1408; }
#grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
figure { margin: 0; background: var(--panel); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
canvas { width: 100%; border-radius: 8px; display: block; }
figcaption { font-size: 15px; } figcaption b { color: var(--accent); margin-inline-end: 4px; }
input[type=range] { flex: 1; min-width: 200px; direction: ltr; }
#strip { cursor: pointer; direction: ltr; }
#ed { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 14px; }
#ed label { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
#ed input { min-width: 0; } #ed b { color: var(--ink); font-variant-numeric: tabular-nums; direction: ltr; text-align: left; }
textarea { width: 100%; height: 54px; background: var(--panel); color: var(--muted); border: 0; border-radius: 8px; font: 11px ui-monospace, monospace; direction: ltr; }
@media (max-width: 700px) { #grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>מחזור ריצה – תנוחות מפתח</h1>
  <div id="err" style="display:none;background:#7f1d1d;color:#fff;padding:8px 10px;border-radius:8px;font:13px ui-monospace,monospace;direction:ltr;text-align:left"></div>
  <div class="row"><button id="slow">🐢 לאט</button><button id="pause">⏸ עצור</button><button id="prev">→ תנוחה קודמת</button><button id="next">תנוחה הבאה ←</button><button id="keys">רק תנוחות המפתח</button><button id="ghost">כל התנוחות שקופות</button></div>
  <div class="row"><p>גלילה בתוך המחזור:</p><input type="range" id="scrub" min="0" max="1000" value="0"></div>
  <div id="grid">
    <figure><canvas class="run"></canvas><figcaption><b>היום</b>רגליים וידיים מתנדנדות בגל אחיד</figcaption></figure>
    <figure><canvas class="run"></canvas><figcaption><b>חדש</b>מגע → ירידה → מעבר → ריחוף, ושוב עם הרגל השנייה</figcaption></figure>
  </div>
  <figure><canvas id="strip"></canvas><figcaption><b>התנוחות</b>שמונה תנוחות במחזור: כחול – צעד עם רגל אחת, ירוק – עם השנייה. לחיצה על תנוחה עוצרת עליה. הסימנים על הקרקע זזים בקצב של המשחק – כך רואים אם הרגל על הקרקע מחליקה</figcaption></figure>
  <figure><figcaption><b>עריכה</b>בוחרים תנוחה ומזיזים את הזוויות. הצעד עם הרגל השנייה מתעדכן לבד. כשזה נראה טוב – "העתק" ושולחים לי את הטקסט</figcaption>
    <div class="row"><button data-k="0">1 מגע</button><button data-k="1">2 ירידה</button><button data-k="2">3 מעבר</button><button data-k="3">4 ריחוף</button><button id="copy">📋 העתק</button></div>
    <div id="ed"></div><textarea id="out" readonly></textarea></figure>
</main>
<script>let ctx = null;</script>
<script src="ninja-figure.js?v=run2"></script>
<script>
function showErr(e) { const b = document.getElementById('err'); if (b && !b.dataset.on) { b.dataset.on = 1; b.textContent = '⚠️ ' + (e && (e.message || e)) + (e && e.stack ? '  |  ' + String(e.stack).split('\n').slice(0, 2).join(' ← ') : ''); b.style.display = 'block'; } }
addEventListener('error', ev => showErr(ev.error || ev.message));
// דף ניסוי: מחזור ריצה. למעלה – היום (גלים), באמצע – חדש (תנוחות מפתח), למטה – פס התנוחות
const W = 44, H = 26, G = 22, NX = 18;
const STEP = 15;                    // כמה העולם זז במחזור שלם (שני צעדים) – כמו במשחק: poseRun(bgX * 0.42)
let speed = 1, paused = false, ph = 0, last = performance.now() / 1000, keysOnly = false, ghosts = false;
const L = (a, b, k) => a + (b - a) * k;

// ---- תנוחות המפתח לצעד אחד (רגל "ימין" = הרגל הקדמית בציור, legs[1]; יד קדמית = arms[1]) ----
// זוויות: 0 = למטה, חיובי = קדימה. ירך / שוק, כתף / אמה. bob – גובה הגוף (חיובי = למעלה)
const KEYS = [
  { name: 'מגע',   air: 0,  R: [0.55, 0.38],  Lg: [-0.5, -1.35], fR: 0.25, fL: -0.6, aF: [-0.65, 0.35], aB: [0.75, 2.15], lean: 0.2 },
  { name: 'ירידה', air: 0, R: [0.2, -0.3],   Lg: [-0.15, -1.95], fR: 0.0,  fL: -0.9, aF: [-0.4, 0.75],  aB: [0.45, 1.95], lean: 0.24 },
  { name: 'מעבר',  air: 0, R: [-0.12, -0.32], Lg: [0.45, -1.05], fR: 0.0,  fL: -0.5, aF: [0.0, 1.3],    aB: [0.0, 1.4],   lean: 0.22 },
  { name: 'ריחוף', air: 1,  R: [-0.6, -0.95], Lg: [1.0, 0.05],    fR: -0.85, fL: 0.1, aF: [0.65, 2.05],  aB: [-0.6, 0.35], lean: 0.2 },
];
// הצעד השני – אותו דבר עם הרגליים והידיים מוחלפות
function keyAt(i) {
  const K = KEYS[i % 4], m = Math.floor(i / 4) % 2 === 1;
  return m ? { air: K.air, R: K.Lg, Lg: K.R, fR: K.fL, fL: K.fR, aF: K.aB, aB: K.aF, lean: K.lean, name: K.name }
           : { air: K.air, R: K.R, Lg: K.Lg, fR: K.fR, fL: K.fL, aF: K.aF, aB: K.aB, lean: K.lean, name: K.name };
}
const cr = (p0, p1, p2, p3, t) => 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);   // Catmull-Rom – מעבר חלק דרך התנוחות
function poseKeyed(p) {             // p: 0..1 = מחזור שלם (8 תנוחות)
  const x = ((p % 1) + 1) % 1 * 8, i = Math.floor(x), t = keysOnly ? 0 : x - i;
  const k = [keyAt(i + 7), keyAt(i), keyAt(i + 1), keyAt(i + 2)];
  const v = f => cr(f(k[0]), f(k[1]), f(k[2]), f(k[3]), t);
  const legs = [[v(q => q.Lg[0]), v(q => q.Lg[1])], [v(q => q.R[0]), v(q => q.R[1])]];
  // הגובה של הגוף נקבע לבד: הרגל הנמוכה נוגעת בדיוק בקרקע, ובריחוף – הגוף עולה קצת מעליה
  const S = RIG.shape, drop = l => S.thigh * Math.cos(l[0]) + S.shin * Math.cos(l[1]);
  const bob = 4.6 - Math.max(drop(legs[0]), drop(legs[1])) - v(q => q.air) * 0.9;
  return { hipY: -4.6, torso: RIG.shape.torso, lean: v(q => q.lean), bob, spine: 0.12,
           legs,
           arms: [[v(q => q.aB[0]), v(q => q.aB[1])], [v(q => q.aF[0]), v(q => q.aF[1])]],
           feet: [v(q => q.fL), v(q => q.fR)], key: keyAt(Math.round(x) % 8).name, near: Math.abs(x - Math.round(x)) < 0.08 };
}
function scene(c, label, off) {
  c.fillStyle = '#cfe8f3'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#8fbf6a'; c.fillRect(0, G, W, H - G);
  c.fillStyle = '#4ade80'; c.fillRect(0, G - 0.4, W, 0.8);
  c.fillStyle = 'rgba(0,0,0,.25)';                                    // סימנים על הקרקע – רואים אם הרגל "מחליקה"
  for (let x = -((off % 5) + 5) % 5; x < W; x += 5) c.fillRect(x, G + 0.6, 0.35, 1.4);
}
const cvs = [...document.querySelectorAll('canvas.run')], strip = document.getElementById('strip');
function fit() { [...cvs, strip].forEach(cv => { const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.width * (cv === strip ? 0.22 : H / W) * devicePixelRatio; }); }
addEventListener('resize', fit); fit();
function drawRun(c, i) {
  const off = ph * STEP;
  scene(c, '', off);
  const P = i === 0 ? poseRun(ph * 2 * Math.PI) : poseKeyed(ph);
  if (ghosts && i === 1) {
    for (let j = 0; j < 8; j++) { const Q = poseKeyed(j / 8); c.globalAlpha = 0.12; drawFigure({ fx: NX, fy: G, facing: 1, scale: 1, kind: 'ninja', accent: '#2563eb', pose: Q }); }
    c.globalAlpha = 1;
  }
  drawFigure({ fx: NX, fy: G, facing: 1, scale: 1, kind: 'ninja', accent: i ? '#2563eb' : '#dc2626', pose: P });
  if (i === 1) { c.fillStyle = P.near ? '#1e3a8a' : 'rgba(30,58,138,.35)'; c.font = '700 2.2px system-ui'; c.textAlign = 'center'; c.fillText(P.key, NX, 3); }
}
function drawStrip() {
  const c = strip.getContext('2d'), s = strip.width / 88; ctx = c;
  c.setTransform(s, 0, 0, s, 0, 0);
  c.fillStyle = '#e8f0ea'; c.fillRect(0, 0, 88, 20);
  c.fillStyle = '#8fbf6a'; c.fillRect(0, 16, 88, 4);
  const cur = Math.round(((ph % 1) + 1) % 1 * 8) % 8;
  for (let j = 0; j < 8; j++) {
    const x = 5.5 + j * 11, Q = poseKeyed(j / 8);
    if (j === cur) { c.fillStyle = 'rgba(227,163,59,.35)'; c.fillRect(x - 5.3, 0, 10.6, 20); }
    drawFigure({ fx: x, fy: 16, facing: 1, scale: 0.62, kind: 'ninja', accent: j < 4 ? '#2563eb' : '#0d9488', pose: Q });
    c.fillStyle = '#1b1408'; c.font = '700 1.6px system-ui'; c.textAlign = 'center'; c.fillText((j + 1) + ' ' + keyAt(j).name, x, 19.2);
  }
}
function frame() {
  const now = performance.now() / 1000, dt = Math.min(0.05, now - last); last = now;
  if ([...cvs, strip].some(cv => Math.abs(cv.width - cv.getBoundingClientRect().width * devicePixelRatio) > 2 || !cv.height)) fit();   // הדף נטען מוסתר – מתאימים את הגודל כשהוא מופיע
  if (!paused) { ph += dt * speed * 1.45; $slider.value = (((ph % 1) + 1) % 1) * 1000; }     // בערך הקצב של המשחק
  try {
  cvs.forEach((cv, i) => { const c = cv.getContext('2d'); ctx = c; const s = cv.width / W; c.setTransform(s, 0, 0, s, 0, 0); drawRun(c, i); });
  drawStrip();
  } catch (e) { showErr(e); }
  requestAnimationFrame(frame);
  }
const $ = id => document.getElementById(id), $slider = $('scrub');
$('slow').onclick = e => { speed = speed === 1 ? 0.2 : 1; e.target.classList.toggle('on', speed < 1); };
$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? '▶ המשך' : '⏸ עצור'; };
$('keys').onclick = e => { keysOnly = !keysOnly; e.target.classList.toggle('on', keysOnly); };
$('ghost').onclick = e => { ghosts = !ghosts; e.target.classList.toggle('on', ghosts); };
$('prev').onclick = () => { paused = true; $('pause').textContent = '▶ המשך'; ph = (Math.round(ph * 8) - 1) / 8; $slider.value = (((ph % 1) + 1) % 1) * 1000; };
$('next').onclick = () => { paused = true; $('pause').textContent = '▶ המשך'; ph = (Math.round(ph * 8) + 1) / 8; $slider.value = (((ph % 1) + 1) % 1) * 1000; };
$slider.oninput = () => { paused = true; $('pause').textContent = '▶ המשך'; ph = $slider.value / 1000; };
strip.onclick = e => { const r = strip.getBoundingClientRect(), j = Math.floor((e.clientX - r.left) / r.width * 8); paused = true; $('pause').textContent = '▶ המשך'; ph = j / 8; };
requestAnimationFrame(frame);

// ---- עריכת תנוחה: בוחרים תנוחה (1–4) ומזיזים את הזוויות. הצעד השני מתעדכן לבד (הפוך) ----
const FIELDS = [['R', 0, 'ירך – רגל קדמית'], ['R', 1, 'שוק – רגל קדמית'], ['Lg', 0, 'ירך – רגל אחורית'], ['Lg', 1, 'שוק – רגל אחורית'],
                ['aF', 0, 'כתף – יד קדמית'], ['aF', 1, 'אמה – יד קדמית'], ['aB', 0, 'כתף – יד אחורית'], ['aB', 1, 'אמה – יד אחורית'],
                ['fR', null, 'כף רגל קדמית'], ['fL', null, 'כף רגל אחורית'], ['lean', null, 'הטיית הגוף'], ['air', null, 'ריחוף']];
let sel = 0;
function buildEditor() {
  const box = $('ed'); box.innerHTML = '';
  FIELDS.forEach(([k, i, label]) => {
    const K = KEYS[sel], val = i === null ? K[k] : K[k][i], rng = k === 'air' ? [0, 1] : k === 'lean' ? [-0.3, 0.8] : [-3, 3.2];
    const row = document.createElement('label');
    row.innerHTML = '<span>' + label + '</span><input type="range" min="' + rng[0] + '" max="' + rng[1] + '" step="0.01" value="' + val + '"><b>' + (+val).toFixed(2) + '</b>';
    const inp = row.querySelector('input'), out = row.querySelector('b');
    inp.oninput = () => { const v = +inp.value; if (i === null) KEYS[sel][k] = v; else KEYS[sel][k][i] = v; out.textContent = v.toFixed(2); dump(); };
    box.appendChild(row);
  });
  document.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', +b.dataset.k === sel));
  dump();
}
function dump() { $('out').value = JSON.stringify(KEYS.map(K => ({ name: K.name, air: K.air, R: K.R, Lg: K.Lg, fR: K.fR, fL: K.fL, aF: K.aF, aB: K.aB, lean: K.lean }))); }
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sel = +b.dataset.k; buildEditor(); paused = true; $('pause').textContent = '▶ המשך'; ph = sel / 8; keysOnly = true; $('keys').classList.add('on'); });
$('copy').onclick = () => { $('out').select(); try { navigator.clipboard.writeText($('out').value); $('copy').textContent = '✓ הועתק'; } catch (e) {} };
buildEditor();
requestAnimationFrame(frame);

</script>
</body>
</html>
